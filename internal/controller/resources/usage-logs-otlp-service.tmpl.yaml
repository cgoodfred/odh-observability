apiVersion: v1
kind: Service
metadata:
  name: {{.UsageLogsOTLPServiceName}}
  namespace: {{.Namespace}}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{.UsageLogsReceiverTLSSecretName}}
  labels:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: {{.Namespace}}.{{.UsageLogsCollectorName}}
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/name: {{.UsageLogsOTLPServiceName}}
    app.kubernetes.io/part-of: opentelemetry
spec:
  selector:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: {{.Namespace}}.{{.UsageLogsCollectorName}}
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/part-of: opentelemetry
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  type: ClusterIP
